name: mundinho_divertido
description: "Mundinho Divertido - Jogo infantil para Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine
  flame: ^1.28.0
  flame_audio: ^2.11.0

  # Fonts
  google_fonts: ^6.2.1

  # Persistência local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.6

  # Firebase (opt-in analytics + crashlytics)
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

  # Monetização (futuro)
  # google_mobile_ads: ^6.0.0

  # Utilidades
  equatable: ^2.0.7
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/characters/player/
    - assets/images/characters/npcs/
    - assets/images/buildings/
    - assets/images/interiors/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/effects/
    - assets/audio/
